name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CGO_ENABLED: "1"
  APPIMAGE_EXTRACT_AND_RUN: "1"

jobs:
  verify:
    name: Verify & Test
    # gotk4 v0.4.1 needs GLib 2.86+; Ubuntu 24.04 ships 2.80.
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    outputs:
      version: ${{ steps.ver.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install GTK4 build deps
        run: bash ./scripts/ci/install_gtk.sh

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Read version
        id: ver
        run: eval "$(bash ./scripts/ci/app_version.sh)" && echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Tag must match VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="${{ steps.ver.outputs.name }}"
          echo "tag=$tag version=$version"
          test "$tag" = "$version"

      - name: Test
        run: go test ./...

      - name: Test AppImage GTK runtime hook
        run: bash scripts/ci/test_appimage_gtk_runtime.sh

      - name: Build native binary
        env:
          LAMHA_VERSION: ${{ steps.ver.outputs.name }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X github.com/lamha-app/lamha/internal/version.Version=${LAMHA_VERSION}" \
            -o "dist/lamha-${LAMHA_VERSION}-linux-x86_64" ./cmd/lamha
          chmod +x "dist/lamha-${LAMHA_VERSION}-linux-x86_64"

      - name: Upload native binary
        uses: actions/upload-artifact@v4
        with:
          name: release-native
          path: dist/lamha-*-linux-x86_64
          if-no-files-found: error

  build:
    name: Portable AppImage
    needs: verify
    # Ubuntu 22.04 is glibc 2.35 (April 2022). Bundle conda-forge GTK 4.22.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install host toolchain
        run: bash ./scripts/ci/install_portable_host.sh

      - name: Cache conda GTK prefix
        uses: actions/cache@v4
        with:
          path: .ci-gtk
          key: portable-gtk-${{ runner.os }}-${{ hashFiles('scripts/ci/portable_gtk.txt') }}

      - name: Portable GTK prefix
        run: bash ./scripts/ci/portable_gtk.sh

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build AppImage
        env:
          LAMHA_VERSION: ${{ needs.verify.outputs.version }}
        run: bash packaging/appimage/build.sh

      - name: Check glibc baseline
        run: |
          bash ./scripts/ci/check_glibc.sh dist/Lamha.AppDir/usr/bin/lamha
          found=0
          while IFS= read -r so; do
            found=1
            bash ./scripts/ci/check_glibc.sh "$so"
          done < <(find dist/Lamha.AppDir/usr/lib -maxdepth 1 \( -name 'libgtk-4.so.1' -o -name 'libglib-2.0.so.0' \))
          test "$found" = 1

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: release-appimage
          path: |
            dist/Lamha-*-x86_64.AppImage
            dist/Lamha-*-x86_64.AppImage.zsync
          if-no-files-found: error

  github-release:
    name: GitHub Release
    needs: [verify, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum \
            "lamha-${{ needs.verify.outputs.version }}-linux-x86_64" \
            "Lamha-${{ needs.verify.outputs.version }}-x86_64.AppImage" \
            "Lamha-${{ needs.verify.outputs.version }}-x86_64.AppImage.zsync" \
            > sha256sums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Lamha ${{ needs.verify.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/lamha-*-linux-x86_64
            dist/Lamha-*-x86_64.AppImage
            dist/Lamha-*-x86_64.AppImage.zsync
            dist/sha256sums.txt
