name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CGO_ENABLED: "1"
  APPIMAGE_EXTRACT_AND_RUN: "1"

jobs:
  verify:
    name: Verify & Test
    # gotk4 v0.4.1 needs GLib 2.86+; Ubuntu 24.04 ships 2.80.
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    outputs:
      version: ${{ steps.ver.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install GTK4 build deps
        run: bash ./scripts/ci/install_gtk.sh

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Read version
        id: ver
        run: eval "$(bash ./scripts/ci/app_version.sh)" && echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Tag must match VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="${{ steps.ver.outputs.name }}"
          echo "tag=$tag version=$version"
          test "$tag" = "$version"

      - name: Test
        run: go test ./...

  build:
    name: Binary & AppImage
    needs: verify
    # gotk4 v0.4.1 needs GLib 2.86+; Ubuntu 24.04 ships 2.80.
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install GTK4 build deps
        run: bash ./scripts/ci/install_gtk.sh

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        env:
          LAMHA_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X github.com/lamha-app/lamha/internal/version.Version=${LAMHA_VERSION}" \
            -o "dist/lamha-${LAMHA_VERSION}-linux-x86_64" ./cmd/lamha
          chmod +x "dist/lamha-${LAMHA_VERSION}-linux-x86_64"

      - name: Build AppImage
        env:
          LAMHA_VERSION: ${{ needs.verify.outputs.version }}
        run: bash packaging/appimage/build.sh

      - name: Checksums
        run: |
          cd dist
          sha256sum \
            "lamha-${{ needs.verify.outputs.version }}-linux-x86_64" \
            "Lamha-${{ needs.verify.outputs.version }}-x86_64.AppImage" \
            > sha256sums.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            dist/lamha-*-linux-x86_64
            dist/Lamha-*-x86_64.AppImage
            dist/sha256sums.txt
          if-no-files-found: error

  github-release:
    name: GitHub Release
    needs: [verify, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-linux
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Lamha ${{ needs.verify.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/lamha-*-linux-x86_64
            dist/Lamha-*-x86_64.AppImage
            dist/sha256sums.txt
